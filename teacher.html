<!doctype html>
<html lang="vi">
<head>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="BALO Mandarin">
<meta name="application-name" content="BALO Mandarin">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản lý lớp · BALO Mandarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  --acc:#2F7A6D; --acc-d:#6CC4B2; --seal:#C2412D; --seal-d:#F08A6E;
  --paper:#EDF1EE; --paper2:#E3E9E5; --sheet:#FBFCFB; --ink:#18231F; --muted:#5A6863; --line:#D4DCD8;
  --acc-soft:color-mix(in srgb,var(--acc) 13%,var(--sheet)); --seal-soft:color-mix(in srgb,var(--seal) 12%,var(--sheet));
  --good:#2E7D4F; --good-soft:#E1F1E6;
  --t1:#C2412D; --t2:#C78A12; --t3:#2F8A4C; --t4:#2F5FB0; --t5:#7A8580;
  --han:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:16px; --r:18px; --shadow:0 1px 2px rgba(20,35,30,.05),0 6px 18px rgba(20,35,30,.06);
  --jade:var(--acc); --jade-soft:var(--acc-soft);
}
:root[data-skin="sakura"]{--acc:#A23E5E;--acc-d:#EB8FAD;--paper:#F5EDEF;--paper2:#EDE2E5;--sheet:#FFFCFD;--line:#E5D6DB;--ink:#2A1D22;--muted:#6E5C63}
:root[data-skin="indigo"]{--acc:#2F4C8C;--acc-d:#8FA9E8;--paper:#ECEFF5;--paper2:#E1E6EF;--sheet:#FCFDFF;--line:#D3DAE6;--ink:#161D2B;--muted:#59627A}
:root[data-skin="bamboo"]{--acc:#55762A;--acc-d:#A8CC72;--paper:#EFF1E6;--paper2:#E5E9D8;--sheet:#FDFEF9;--line:#DADFC9;--ink:#1F2416;--muted:#62695A}
:root[data-skin="ink"]{--acc:#2B2B2B;--acc-d:#E2DCCF;--seal:#B3261E;--paper:#F2F0EB;--paper2:#E8E5DD;--sheet:#FFFFFF;--line:#DCD8CE;--ink:#151515;--muted:#625E57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11161A; --paper2:#0C1013; --sheet:#182026; --ink:#E8EEEC; --muted:#9AA8A4; --line:#2A353C;
  --acc:var(--acc-d); --seal:var(--seal-d); --good:#7AD39E; --good-soft:#18301F;
  --t1:#F08A6E; --t2:#E8C25A; --t3:#7AD39E; --t4:#86A9F0; --t5:#8E9A96;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161A; --paper2:#0C1013; --sheet:#182026; --ink:#E8EEEC; --muted:#9AA8A4; --line:#2A353C;
  --acc:var(--acc-d); --seal:var(--seal-d); --good:#7AD39E; --good-soft:#18301F;
  --t1:#F08A6E; --t2:#E8C25A; --t3:#7AD39E; --t4:#86A9F0; --t5:#8E9A96;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
:root[data-hanfont="kai"]{--han:"LXGW WenKai TC","Kaiti TC","STKaiti",serif}
:root[data-hanfont="sans"]{--han:"Noto Sans TC","PingFang TC","Heiti TC",sans-serif}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.5 var(--body);min-height:100vh;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:900px){header h1{flex:1 1 60%}header .sp{display:none}}
.stamp{width:50px;height:50px;border-radius:12px;background:var(--seal);color:#fff;display:grid;place-items:center;font:700 14px/1.1 var(--han);text-align:center;transform:rotate(-4deg);flex:none}
h1{font-size:22px;margin:0;line-height:1.2}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
h2{margin:0;font-size:20px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:12px;min-height:44px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dng{color:var(--seal);border-color:color-mix(in srgb,var(--seal) 40%,var(--line))}
.btn:disabled{opacity:.6}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.chipme{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px}
.chipme i{width:30px;height:30px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-style:normal;font-weight:800}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}
@media (max-width:860px){.side{position:static}}
.side .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:4px 4px 0}
.cls{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.cls b{font-size:17px;letter-spacing:.04em}
.cls span{font-size:13px;color:var(--muted)}
.cls[aria-current="true"]{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 1px var(--acc) inset}
.cls.add{border-style:dashed;color:var(--acc);font-weight:700;align-items:center}
@media (max-width:860px){.clist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.clist .cls{flex:none;min-width:150px}}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px;width:100%}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.err{color:var(--seal);font-size:14px;min-height:1.2em;margin:0}
.ok{color:var(--good)}
.meta{color:var(--muted);font-size:13px}
.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code{font:800 30px/1 var(--body);letter-spacing:.08em;color:var(--acc);background:var(--acc-soft);border-radius:12px;padding:8px 14px}
.tabs{display:inline-flex;background:var(--paper2);border-radius:14px;padding:4px;flex-wrap:wrap}
.tabs button,.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--muted);padding:0 16px;min-height:40px;border-radius:10px;cursor:pointer}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--acc);box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--paper2);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbox{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--sheet);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--paper2);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;user-select:none;z-index:1}
th.s{cursor:pointer}
th:first-child,td:first-child{text-align:left;position:sticky;left:0}
td:first-child{background:var(--sheet);font-weight:600}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
.click tbody tr{cursor:pointer}
.click tbody tr:hover td{background:var(--acc-soft)}
.cell{display:block;border-radius:6px;padding:2px 6px;text-align:center;min-width:34px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--acc-soft);color:var(--acc)}
.pill.bad{background:var(--seal-soft);color:var(--seal)}
.pill.mute{background:var(--paper2);color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.acts{display:flex;gap:6px;justify-content:flex-end}
.lnk{border:0;background:none;color:var(--acc);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:8px}
.lnk:hover{background:var(--acc-soft)}
.lnk.dng{color:var(--seal)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.45);display:grid;place-items:center;padding:16px}
.modal .card{width:min(460px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:12px;font-weight:600;z-index:70;box-shadow:var(--shadow)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
#busyBar{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:8px 16px 8px 12px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
#busyBar i{width:16px;height:16px;border-radius:50%;border:3px solid var(--acc-soft);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.busy{cursor:progress}
@media print{body{background:#fff}header,.side,.tabs,.noprint{display:none!important}.layout{display:block}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stamp">當代<br>中文</div>
    <h1>Quản lý lớp học<small>BALO Mandarin · 當代中文課程 1</small></h1>
    <span class="sp"></span>
    <span class="chipme" id="me" hidden><i id="meI">G</i><span id="meN"></span></span>
    <a class="btn sm" href="./" id="toApp">Mở trang học</a>
    <button class="btn sm" id="acct">Tài khoản</button>
    <button class="btn sm" id="out">Đăng xuất</button>
  </header>
  <div class="loading" id="loading">Đang tải dữ liệu…</div>
  <div class="layout" id="main" hidden>
    <aside class="side">
      <div class="lbl">Lớp của tôi</div>
      <div class="clist" id="clist"></div>
      <div id="adminSide" hidden>
        <div class="lbl" style="margin-top:8px">Quản trị</div>
        <button class="cls" id="tchBtn"><b style="font-size:15px;letter-spacing:0">Tài khoản giáo viên</b><span id="tchCount"></span></button>
      </div>
      <p class="meta" style="margin:6px 4px 0">Số liệu lưu trong file Google Sheets của bạn trên Drive (trang <b>ThongKe</b>, <b>NhatKy</b>, <b>HocSinh</b>, <b>Lop</b>).</p>
    </aside>
    <main id="pane" style="display:flex;flex-direction:column;gap:16px;min-width:0"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="busyBar" hidden><i></i><span>Đang làm việc với máy chủ…</span></div>
<script>
const TRACK_URL="https://script.google.com/macros/s/AKfycbyRqPnotsCmWmIq41fskY-MyqUliFWeventBwIQw7Ps0JJavWCKRxj-T0aTnV6gdRE4TA/exec";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{const c=JSON.parse(localStorage.getItem("tv1:cfg")||"{}");if(c.mode&&c.mode!=="auto")document.documentElement.dataset.theme=c.mode;if(c.skin&&c.skin!=="celadon")document.documentElement.dataset.skin=c.skin}catch(e){}
let CRED=null;try{CRED=JSON.parse(sessionStorage.getItem("tvT:cred")||localStorage.getItem("tvT:cred")||"null")}catch(e){}
if(!CRED||!TRACK_URL){location.replace("./?gv=1")}
let D=null,CLS=null,TAB="stats",VIEW="st",METRIC="min",SORT={k:"min",d:-1},PANE="class";
try{CLS=localStorage.getItem("tvT:cls")}catch(e){}
const COL={c:0,s:1,n:2,bai:3,f:4,seen:5,li:6,q:7,qc:8,lq:9,lqc:10,min:11,kn:12,last:13};
let PEND=0;function busyUI(on){PEND+=on?1:-1;document.body.classList.toggle("busy",PEND>0);$("#busyBar").hidden=PEND<=0}
async function api(o){const btn=document.activeElement&&document.activeElement.tagName==="BUTTON"?document.activeElement:null;if(btn){if(btn.disabled)throw new Error("dup");btn.disabled=true;btn.dataset.t=btn.textContent;if(o.a!=="data")btn.textContent="Đang xử lý…"}
  $("#busyBar span").textContent=o.a==="data"?"Đang cập nhật dữ liệu mới…":"Đang làm việc với máy chủ…";busyUI(true);try{return await apiRaw(o)}catch(e){if(e.message!=="auth"&&e.message!=="dup"){toast(e.message.startsWith("srv:")?"Máy chủ báo lỗi: "+e.message.slice(4):"Không kết nối được máy chủ, thử lại sau vài giây.")}throw e}finally{busyUI(false);if(btn){btn.disabled=false;if(btn.dataset.t)btn.textContent=btn.dataset.t}}}
addEventListener("unhandledrejection",e=>{e.preventDefault()});
async function apiRaw(o){o=Object.assign({u:CRED.u,p:CRED.p},o);
  const r=await fetch(TRACK_URL+"?j="+encodeURIComponent(JSON.stringify(o)),{method:"GET",redirect:"follow",cache:"no-store"});const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){const m=/<title>([^<]*)<\/title>|class="errorMessage"[^>]*>([^<]*)/i.exec(txt);throw new Error("srv:"+((m&&(m[2]||m[1]))||txt.replace(/<[^>]+>/g," ").trim()).slice(0,160))}
  if(j.auth){logout();throw new Error("auth")}if(j.data&&j.data.ok)FRESH=j.data;return j}
function logout(){try{sessionStorage.removeItem("tvT:cred");localStorage.removeItem("tvT:cred");localStorage.removeItem(DKEY)}catch(e){}location.replace("./?gv=1")}
$("#out").onclick=logout;
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function modal(html,bind){const root=$("#modalRoot");root.innerHTML=`<div class="modal"><div class="card">${html}</div></div>`;const m=root.firstElementChild;
  m.onclick=e=>{if(e.target===m)close()};const close=()=>{root.innerHTML=""};m.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);bind&&bind(m,close);const f=m.querySelector("input,textarea");if(f)setTimeout(()=>f.focus(),50)}
let FRESH=null;
const DKEY="tvT:D:"+(CRED&&CRED.u||"").toUpperCase();
function show(r){D=r;$("#loading").hidden=true;$("#main").hidden=false;$("#me").hidden=false;$("#meN").textContent=D.me.n+(D.me.admin&&!/quản trị/i.test(D.me.n)?" · Quản trị":"");$("#meI").textContent=(D.me.n||"G").trim().slice(0,1).toUpperCase();
    if(!D.classes.some(c=>c.c===CLS))CLS=D.classes[0]?D.classes[0].c:null;const ae=document.activeElement;if(!document.querySelector(".modal")&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$("#pane").contains(ae)))draw()}
async function load(){try{let r;if(FRESH){r=FRESH;FRESH=null}else r=await api({a:"data"});if(!r.ok||!r.classes){if(D)return;$("#loading").textContent=r.err||"Máy chủ chưa cập nhật mã mới (Code.gs phiên bản 2). Dán lại mã và triển khai Phiên bản mới.";return}try{localStorage.setItem(DKEY,JSON.stringify(r))}catch(e){}show(r)}
  catch(e){if(e.message!=="auth"&&!D)$("#loading").textContent="Không kết nối được máy chủ. Kiểm tra mạng rồi tải lại trang."}}
function draw(){sideDraw();if(PANE==="teachers")return teachersDraw();if(!CLS)return emptyDraw();paneDraw()}
function sideDraw(){$("#clist").innerHTML=D.classes.map(c=>{const n=D.roster.filter(r=>r.c===c.c).length;return `<button class="cls" data-c="${esc(c.c)}" aria-current="${PANE==="class"&&c.c===CLS}"><b>${esc(c.c)}</b><span>${esc(c.n||"(chưa đặt tên)")} · ${n} HS${D.me.admin&&c.gv!==D.me.u?" · GV "+esc(c.gv):""}</span></button>`}).join("")+`<button class="cls add" id="newCls">＋ Tạo lớp mới</button>`;
  $("#clist").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{CLS=b.dataset.c;PANE="class";try{localStorage.setItem("tvT:cls",CLS)}catch(e){}draw()});
  $("#newCls").onclick=newClass;
  $("#adminSide").hidden=!D.me.admin;if(D.me.admin){$("#tchCount").textContent=(D.teachers||[]).length+" tài khoản";$("#tchBtn").setAttribute("aria-current",PANE==="teachers");$("#tchBtn").onclick=()=>{PANE="teachers";draw()}}}
function emptyDraw(){$("#pane").innerHTML=`<div class="card empty" style="padding:48px 20px"><h2 style="margin-bottom:8px">Chưa có lớp nào</h2><p>Tạo lớp đầu tiên, đặt mã lớp (ví dụ <b>HOA1A</b>), rồi thêm học sinh.</p><button class="btn pri" id="nc2">＋ Tạo lớp mới</button></div>`;$("#nc2").onclick=newClass}
function newClass(){modal(`<h2>Tạo lớp mới</h2><label class="fld">Mã lớp (học sinh nhập mã này khi đăng nhập)<input id="mC" placeholder="VD: HOA1A" style="text-transform:uppercase" maxlength="20"></label>
  <label class="fld">Tên lớp (tùy chọn)<input id="mN" placeholder="VD: Tiếng Trung sơ cấp – sáng T2"></label><p class="err" id="mE"></p>
  <div class="bar"><span class="sp"></span><button class="btn" data-close>Hủy</button><button class="btn pri" id="mGo">Tạo lớp</button></div>`,(m,close)=>{
  m.querySelector("#mGo").onclick=async()=>{const r=await api({a:"addclass",c:m.querySelector("#mC").value,n:m.querySelector("#mN").value});if(!r.ok){m.querySelector("#mE").textContent=r.err;return}close();CLS=r.c;PANE="class";TAB="students";toast("Đã tạo lớp "+r.c);await load()}})}
function students(){const m=new Map();D.roster.filter(r=>r.c===CLS).forEach(r=>m.set(r.s,{s:r.s,n:r.n,pw:r.pw,inRoster:true}));
  D.rows.filter(r=>String(r[0])===CLS).forEach(r=>{const s=String(r[1]);if(!m.has(s))m.set(s,{s,n:r[2],inRoster:false})});
  const L=[...m.values()];L.forEach(st=>{const rs=D.rows.filter(r=>String(r[0])===CLS&&String(r[1])===st.s);st.rows=rs;const sum=k=>rs.reduce((a,r)=>a+(+r[COL[k]]||0),0);
    Object.assign(st,{f:sum("f"),seen:sum("seen"),li:sum("li"),q:sum("q"),qc:sum("qc"),lq:sum("lq"),lqc:sum("lqc"),min:Math.round(sum("min")*10)/10,kn:sum("kn"),last:rs.reduce((a,r)=>r[13]&&(!a||r[13]>a)?r[13]:a,"")})});return L}
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
const when=t=>{if(!t)return"–";const d=new Date(t),diff=(Date.now()-d)/864e5;return diff<1&&d.getDate()===new Date().getDate()?d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})+" hôm nay":diff<2?"hôm qua":d.toLocaleDateString("vi-VN")};

  document.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>modal(`<h2>Đặt lại mật khẩu · ${esc(b.dataset.rp)}</h2><label class="fld">Mật khẩu mới (ít nhất 6 ký tự)<input id="mP" type="text" autocomplete="off"></label><p class="err" id="mE"></p><div class="bar"><span class="sp"></span><button class="btn" data-close>Hủy</button><button class="btn pri" id="mGo">Lưu</button></div>`,(m,close)=>{
    m.querySelector("#mGo").onclick=async()=>{const r=await api({a:"resetteacher",du:b.dataset.rp,np:m.querySelector("#mP").value});if(!r.ok){m.querySelector("#mE").textContent=r.err;return}close();toast("Đã đặt lại");if(b.dataset.rp===D.me.u){CRED.p=m.querySelector("#mP").value}}}));
  document.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>modal(`<h2>Xóa tài khoản ${esc(b.dataset.dt)}?</h2><p class="meta" style="margin:0">Các lớp của giáo viên này vẫn còn; quản trị có thể giao lại trong Cài đặt lớp.</p><div class="bar"><span class="sp"></span><button class="btn" data-close>Hủy</button><button class="btn dng" id="mGo">Xóa</button></div>`,(m,close)=>{
    m.querySelector("#mGo").onclick=async()=>{await api({a:"delteacher",du:b.dataset.dt});close();toast("Đã xóa");await load()}}))}
$("#acct").onclick=()=>modal(`<h2>Tài khoản · ${esc(CRED.u)}</h2><label class="fld">Mật khẩu mới (ít nhất 6 ký tự)<input id="mP" type="password" autocomplete="new-password"></label><label class="fld">Nhập lại mật khẩu mới<input id="mP2" type="password" autocomplete="new-password"></label><p class="err" id="mE"></p>
  <div class="bar"><span class="sp"></span><button class="btn" data-close>Đóng</button><button class="btn pri" id="mGo">Đổi mật khẩu</button></div>`,(m,close)=>{
  m.querySelector("#mGo").onclick=async()=>{const a=m.querySelector("#mP").value,b=m.querySelector("#mP2").value;if(a!==b){m.querySelector("#mE").textContent="Hai mật khẩu không khớp";return}
    const r=await api({a:"tchpw",np:a});if(!r.ok){m.querySelector("#mE").textContent=r.err;return}CRED.p=a;const cr=JSON.stringify(CRED);try{sessionStorage.setItem("tvT:cred",cr);if(localStorage.getItem("tvT:cred"))localStorage.setItem("tvT:cred",cr)}catch(e){}close();toast("Đã đổi mật khẩu")}});
if(CRED&&TRACK_URL){try{const c=JSON.parse(localStorage.getItem(DKEY)||"null");if(c&&c.ok&&c.classes)show(c)}catch(e){}load()}
</script>
<script>(()=>{const V="98642a0b81";let busy=0,shown=0;const vi=/[?&]v=/.test(location.search);
function go(v){const u=new URL(location.href);u.searchParams.set("v",v);location.replace(u.toString())}
function bar(v){if(shown)return;shown=1;const lg=(()=>{try{return JSON.parse(localStorage.getItem("tv1:lang"))}catch(e){return "vi"}})(),en=lg==="en",idn=lg==="id";
  const d=document.createElement("div");d.setAttribute("role","status");d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:99;display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-radius:14px;background:var(--sheet,#fff);color:var(--ink,#222);border:1px solid var(--line,#ddd);box-shadow:0 8px 28px rgba(0,0,0,.18);font:600 14px system-ui,sans-serif";
  d.innerHTML=(en?"A new version is available":idn?"Versi baru tersedia":"Đã có bản cập nhật mới")+' <button style="border:0;border-radius:10px;padding:8px 14px;background:var(--acc,#2c7a6b);color:#fff;font:inherit;cursor:pointer">'+(en?"Update":idn?"Perbarui":"Cập nhật")+'</button>';
  d.querySelector("button").onclick=()=>go(v);document.body.appendChild(d)}
async function chk(first){if(busy)return;busy=1;try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});const j=await r.json();
  if(j.v&&j.v!==V){let tried=null;try{tried=sessionStorage.getItem("tvUpd")}catch(e){}
    if(first&&tried!==j.v){try{sessionStorage.setItem("tvUpd",j.v)}catch(e){}go(j.v)}else bar(j.v)}}catch(e){}busy=0}
setTimeout(()=>chk(true),400);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")chk(false)});setInterval(()=>chk(false),5*60e3)})();
</script>
